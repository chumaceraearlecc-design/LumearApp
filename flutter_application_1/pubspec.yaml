name: flutter_application_1

description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.3
  latlong2: ^0.10.1
  http: ^1.6.0
  google_maps_flutter: ^2.18.0
  geolocator: ^14.0.3
  flutter_map: ^8.3.2
  audioplayers: ^6.8.1
  mobile_scanner: ^7.4.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.3
  google_fonts: ^6.1.0
  file_picker: ^13.1.0
  open_filex: ^5.0.0
  qr_flutter: ^4.1.0
  pdf: ^3.13.1
  printing: ^5.15.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  image_picker_android: 0.8.13+17

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/logo1.png
    - assets/sounds/opening.mp3
    - assets/sounds/notification.mp3
    - assets/sounds/delivery_notification.mp3
    - assets/images/background_image.png

flutter_launcher_icons:
  android: true
  ios: false

  image_path: "assets/images/logo1.png"

  adaptive_icon_background: "#F3F4F4"
  adaptive_icon_foreground: "assets/images/logoresize.png"

  min_sdk_android: 21